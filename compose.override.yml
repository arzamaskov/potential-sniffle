services:
  app:
    image: runtracker-laravel-php:dev
    build:
      target: development
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
      PHP_IDE_CONFIG: serverName=runtracker-laravel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html

  web:
    image: runtracker-laravel-nginx:dev
    ports: !override
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  vite:
    image: runtracker-laravel-node:dev
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    user: "0:0"
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      HOME: /tmp/node-home
      COREPACK_HOME: /tmp/node-home/.cache/node/corepack
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_URL: ${VITE_DEV_SERVER_URL:-http://localhost:5173}
      VITE_CORS_ORIGIN: ${VITE_CORS_ORIGIN:-http://localhost:8080}
      VITE_PORT: ${VITE_PORT:-5173}
    working_dir: /var/www/html
    command: >
      sh -lc 'mkdir -p node_modules /pnpm/store /tmp/node-home;
      chown -R "$${APP_UID}:$${APP_GID}" node_modules /pnpm/store /tmp/node-home;
      if [ -f package.json ]; then
        exec su-exec "$${APP_UID}:$${APP_GID}" sh -lc "pnpm install && pnpm dev";
      else
        echo "package.json not found; Vite service is idle until Laravel frontend files exist.";
        tail -f /dev/null;
      fi'
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - app

  postgres:
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"

volumes:
  node-modules:
  pnpm-store:
