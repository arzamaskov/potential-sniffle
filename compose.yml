name: runtracker-laravel

services:
  app:
    image: runtracker-laravel-php:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-runtracker}
      DB_USERNAME: ${DB_USERNAME:-runtracker}
      DB_PASSWORD: ${DB_PASSWORD:-runtracker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  web:
    image: runtracker-laravel-nginx:prod
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-runtracker}
      POSTGRES_USER: ${DB_USERNAME:-runtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-runtracker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app

volumes:
  postgres-data:

networks:
  app:
    driver: bridge
